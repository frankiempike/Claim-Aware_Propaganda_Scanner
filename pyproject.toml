[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "claim_aware_propaganda_scanner"
version = "0.0.1"
description = "Our project detects likely propaganda in news articles and social media posts"
authors = [
  { name = "Frankie Pike, Maria Benjamin, and Alexander Cao" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["claim_aware_propaganda_scanner"]
include = ["pyproject.toml", "claim_aware_propaganda_scanner/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["claim_aware_propaganda_scanner"]
force-sort-within-sections = true


[tool.poetry.dependencies]
ipykernel = "^7.2.0"
pandas = "^3.0.1"
textblob = "^0.19.0"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"
